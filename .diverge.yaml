# yaml-language-server: $schema=https://divergedev.com/schemas/diverge.schema.json
version: "1"

services:
  gateway:
    paths:
      - "**/*.go"
      - "Dockerfile"
      - "deploy/**"
    image:
      repository: ghcr.io/divergedev/demo-gateway
      tag_template: "pr-{{.PR}}"
    entrypoint: true
    depends_on:
      - accounts-api
      - payments-api

defaults:
  deploy:
    mode: delta
    namespace: same
  routing:
    mode: header
    baseline_namespace: demo-bank
    header_key: x-preview-id
  lifecycle:
    ttl: 24h
    cleanup_on_merge: true
